
name: 'dbt_athlete'
version: '1.0.0'

profile: 'dbt_athlete'
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"

# Full documentation: https://docs.getdbt.com/docs/configuring-models
models:
  dbt_athlete:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
    
seeds:
  dbt_athlete:
    +quote_columns: true

vars:
  hrv_low_threshold: 0.85
  hrv_moderate_threshold: 0.95
  cmj_severe_drop: -0.15
  cmj_moderate_drop: -0.07
  grip_severe_drop: -0.10
  grip_moderate_drop: -0.05
  doms_severe: 8
  doms_moderate: 6
  min_baseline_days: 7