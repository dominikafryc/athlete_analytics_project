version: 2

models:
  - name: stg_daily_metrics
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, date]
    columns:
      - name: user_id
        data_tests: [not_null]
      - name: date
        data_tests: [not_null]

  - name: stg_user_profile
    columns:
      - name: user_id
        data_tests: [unique, not_null]