version: 2

models:
  - name: fct_daily_readiness
    description: "Daily readiness table: one row per user and day."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, date]
    columns:
      - name: user_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_user_profile')
                field: user_id
      - name: date
        data_tests: [not_null]